name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK en la Nube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generar y asegurar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew

      - name: Compilar APK Debug con Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PresupuestoInteligenteCR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publicar Release con enlace directo para Celular
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Presupuesto Inteligente CR v1.0.${{ github.run_number }}
          body: |
            ### 📱 ¡Tu APK de Presupuesto CR está listo para instalar!
            
            Descarga el archivo adjunto `app-debug.apk` directamente desde tu teléfono móvil.
            
            - **Moneda:** Colones Costarricenses (₡ / CRC)
            - **Cuenta Asociada:** tavo03079999@gmail.com
            - **Funcionalidades incluidas:**
              * Algoritmo de "Dinero Libre Real" en tiempo real
              * Registro por voz Hold-to-Talk con Gemini AI
              * Lector automático de compras y transferencias del BCR
              * Escaneo OCR de tiquetes y facturas
              * Forecast predictivo de flujo de caja a 3 y 6 meses
              * Base de datos local cifrada con SQLCipher (AES-256)
              * Respaldo en la nube con Google Drive
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
