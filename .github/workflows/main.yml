name: Compilar APK SaldoX

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK en la Nube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Descomprimir SaldoX_Actualizado.zip
        run: |
          if [ -f "SaldoX_Actualizado.zip" ]; then
            echo "Descomprimiendo SaldoX_Actualizado.zip..."
            unzip -o SaldoX_Actualizado.zip || true
          fi

      - name: Reparar estructura del proyecto
        run: |
          # 1. Asegurar build.gradle.kts raíz limpio (apply false)
          cat << 'EOF' > build.gradle.kts
          plugins {
              alias(libs.plugins.android.application) apply false
              alias(libs.plugins.kotlin.android) apply false
              alias(libs.plugins.kotlin.kapt) apply false
          }
          EOF

          # 2. Asegurar que settings.gradle.kts incluya :app
          if [ ! -f "settings.gradle.kts" ]; then
            echo 'include(":app")' > settings.gradle.kts
          elif ! grep -q 'include(":app")' settings.gradle.kts; then
            echo 'include(":app")' >> settings.gradle.kts
          fi

          # 3. Asegurar AndroidManifest.xml en ambas rutas
          if [ -f "src/main/AndroidManifest.xml" ] && [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            mkdir -p app/src/main
            cp src/main/AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi
          if [ -f "app/src/main/AndroidManifest.xml" ] && [ ! -f "src/main/AndroidManifest.xml" ]; then
            mkdir -p src/main
            cp app/src/main/AndroidManifest.xml src/main/AndroidManifest.xml
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generar y asegurar Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6 || true
          chmod +x gradlew || true

      - name: Compilar APK Debug con Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Localizar APK generado
        run: |
          mkdir -p build_output
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build_output/app-debug.apk
          else
            find . -name "*-debug.apk" -exec cp {} build_output/app-debug.apk \;
          fi

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SaldoX-APK
          path: build_output/app-debug.apk
          retention-days: 14

      - name: Publicar Release para Celular
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: SaldoX v2.0.${{ github.run_number }}
          body: |
            ### 📱 ¡Tu APK de SaldoX está listo!
            
            Descarga el archivo adjunto `app-debug.apk` directamente en tu teléfono o súbelo a Google Drive.
          files: build_output/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
